<nsw-nav></nsw-nav>
<section class="page home-page mx-auto max-w-7xl px-4 py-24 sm:px-6 sm:py-32 lg:px-8">
  <div class="mx-auto max-w-2xl">
    <h1 class="text-3xl font-bold mb-2">Welcome</h1>

    <div class="progress-wrap">
      <ng-container *ngIf="points$ | async as points; else loading">
        <div class="progress-label">Points: {{ points }}</div>
        <!--div class="progress-label">Points: {{ points }} / {{ total }}</div>
        <div class="progress-track"><div class="progress-fill" [style.width.%]="progress"></div></div-->
      </ng-container>
      <ng-template #loading>
        <div class="progress-label">Points: 0 / {{ total }}</div>
        <!--div class="progress-track"><div class="progress-fill" [style.width.%]="0"></div></div-->
      </ng-template>
    </div>
    <nsw-headings-display></nsw-headings-display>
  </div>
</section>
