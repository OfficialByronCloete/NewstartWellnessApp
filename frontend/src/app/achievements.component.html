<nsw-nav></nsw-nav>
<section class="page achievements-page">
  <h1>Achievements</h1>
  <div class="save-row">
    <span class="user-id">User: {{ userId }}</span>
    <button type="button" (click)="save()">Save</button>
  </div>
  <form (submit)="$event.preventDefault()" class="achievements-form">
    <div class="achievement-group" *ngFor="let group of grouped">
      <h2>{{ group.heading }}</h2>
      <div class="achievement-item" *ngFor="let ch of group.challenges">
        <div *ngIf="!isSpecial(ch)">
          <div class="attempt-controls">
            <button type="button" (click)="addAttempt(ch)">+ Attempt</button>
            <span class="attempt-label">{{ ch.title }} <small class="points">({{ ch.points }} pts/attempt)</small></span>
            <span class="attempt-count">Attempts: {{ getAttempts(ch) }}</span>
            <button type="button" (click)="resetAttempts(ch)">Reset</button>
          </div>
        </div>
        <div *ngIf="isSpecial(ch)" class="upload-item">
          <label>{{ ch.title }} — <a href="https://example.com/upload" target="_blank" rel="noopener">Upload image</a></label>
          <!--input type="text" [value]="getUpload(ch)" (change)="saveUpload(ch, $event.target.value)" placeholder="Paste uploaded image URL (optional)" /-->
        </div>
      </div>
    </div>
  </form>
</section>
