<section class="page login-page">
  <h1>Login</h1>
  <form class="login-form" (submit)="onSubmit($event)">
    <label>
      Email
      <input type="email" placeholder="you@example.com" />
    </label>
    <label>
      Password
      <input type="password" placeholder="••••••••" />
    </label>
    <button type="submit">Sign in (placeholder)</button>
  </form>
  <p class="note">This is a local placeholder login. No backend/auth is used.</p>
</section>
